services:

  cassandra-db:
    image: cassandra:latest
    container_name: cassandra-db
    restart: unless-stopped
    ports:
      - "9042:9042"   # Cassandra CQL port
    environment:
      - CASSANDRA_USER=cassandra
      - CASSANDRA_PASSWORD=cassandra
    volumes:
      - cassandra-data:/var/lib/cassandra

volumes:
  cassandra-data:
    driver: local
